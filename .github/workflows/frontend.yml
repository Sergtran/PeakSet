name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: read

env:
  API_BASE_URL: https://peakset-api.azurewebsites.net/api

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ env.API_BASE_URL }}

      # Guards against publishing the TypeScript sources instead of the bundle.
      - name: Verify the build output
        working-directory: frontend
        run: |
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html still points at the TypeScript source."
            exit 1
          fi
          if ! grep -q '/assets/' dist/index.html; then
            echo "::error::dist/index.html does not reference a hashed bundle."
            exit 1
          fi
          echo "Build output looks correct."

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy to Azure Static Web Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deploys the artifact the build job already verified, instead of rebuilding.
      - name: Download the verified build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true
